<!DOCTYPE html><html lang="zh-CN"><head><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>汉字描红练习</title>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#5D5CDE',
          }
        }
      }
    }
  </script>
  <style>
    body {
      touch-action: manipulation;
      overscroll-behavior: none;
    }
    .character-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      gap: 10px;
    }
    .character-item {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80px;
      cursor: pointer;
      font-size: 2rem;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .hanzi-writer-container {
      width: 100%;
      max-width: 300px;
      height: 300px;
      margin: 0 auto;
    }
    #target {
      background-color: transparent;
      height: 100%;
      width: 100%;
    }
    .accuracy-meter {
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    .loading-spinner {
      border: 4px solid rgba(0, 0, 0, 0.1);
      border-left-color: #5D5CDE;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .dark .loading-spinner {
      border-color: rgba(255, 255, 255, 0.1);
      border-left-color: #5D5CDE;
    }
  </style>
</head>
<body class="font-sans antialiased bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen px-4 py-6">
  <script>
    // 检测暗黑模式
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      document.documentElement.classList.add('dark');
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
      if (event.matches) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    });
  </script>

  <div class="container mx-auto max-w-3xl">
    <h1 class="text-3xl font-bold text-center mb-6">汉字描红练习</h1>
    
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <div class="md:w-2/3">
        <div id="practiceContainer" class="bg-gray-50 dark:bg-gray-800 rounded-lg p-4 flex flex-col items-center">
          <div id="loading" class="my-12 flex flex-col items-center">
            <div class="loading-spinner"></div>
            <p class="mt-3">正在加载...</p>
          </div>
          <div id="practiceArea" class="w-full hidden">
            <div class="flex items-center justify-between mb-4">
              <h2 id="currentCharacter" class="text-2xl font-bold"></h2>
              <div class="flex gap-2">
                <button id="animateButton" class="px-3 py-1 bg-primary text-white rounded-md hover:bg-opacity-90 transition">
                  播放
                </button>
                <!-- 添加速度控制按钮 -->
                <div class="relative">
                  <button id="speedButton" class="px-3 py-1 bg-primary text-white rounded-md hover:bg-opacity-90 transition flex items-center">
                    <span>速度：</span><span id="currentSpeedText">中</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                    </svg>
                  </button>
                  <div id="speedOptions" class="absolute right-0 mt-1 bg-white dark:bg-gray-700 rounded-md shadow-lg z-10 hidden">
                    <div class="py-1">
                      <button data-speed="0.5" class="speed-option block w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-600">慢</button>
                      <button data-speed="1.0" class="speed-option block w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-600">中</button>
                      <button data-speed="2.0" class="speed-option block w-full text-left px-4 py-2 text-sm hover:bg-gray-100 dark:hover:bg-gray-600">快</button>
                    </div>
                  </div>
                </div>
                <button id="clearButton" class="px-3 py-1 bg-gray-200 dark:bg-gray-700 rounded-md hover:bg-opacity-90 transition">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                  </svg>
                </button>
              </div>
            </div>
            <div class="hanzi-writer-container" id="writer-container">
              <div id="target"></div>
            </div>
            <!-- 移除正确率显示和进度条 -->
            <div class="mt-4 flex justify-between">
              <button id="prevButton" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-md hover:bg-opacity-90 transition">上一个</button>
              <button id="nextButton" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-opacity-90 transition">下一个</button>
            </div>
          </div>
        </div>
      </div>
      
      <div class="md:w-1/3">
        <div class="bg-gray-50 dark:bg-gray-800 rounded-lg p-4">
          <h3 class="text-lg font-semibold mb-3">选择练习汉字</h3>
          <div id="characterList" class="character-grid"></div>
          
          <!-- 移除单字添加功能区 -->
          
          <!-- 批量导入功能 -->
          <div class="mt-4">
            <h3 class="text-lg font-semibold mb-2">添加文字</h3>
            <textarea id="batchImportInput" placeholder="请输入单个或多个汉字" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 text-base mb-2" rows="3"></textarea>
            <button id="batchImportButton" class="w-full px-3 py-2 bg-primary text-white rounded-md hover:bg-opacity-90 transition">批量导入</button>
            
            <!-- 添加一键清空按钮 -->
            <button id="clearAllButton" class="w-full px-3 py-2 bg-red-600 text-white rounded-md hover:bg-opacity-90 transition mt-2">一键清空</button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="text-center text-sm text-gray-500 dark:text-gray-400">
      <p>提示：点击"播放"按钮查看笔顺，然后用鼠标或手指跟随笔画练习。<p>
      </p>本软件由Mike老师开发，如需要修改请加老师微信：my---me</p>
    </div>
  </div>

  <script>
    // 默认汉字列表 - 改为"汉、字、练、习"
    const defaultCharacters = ['汉', '字', '练', '习'];
    let characters = [...defaultCharacters];
    let currentIndex = 0;
    let writer = null;
    let accuracy = 0;
    let isAnimating = false; // 添加动画状态标记
    let animationPromise = null; // 添加动画Promise引用
    let currentSpeed = 1.0; // 添加当前速度变量，默认中速

    // DOM 元素
    const characterListEl = document.getElementById('characterList');
    const currentCharacterEl = document.getElementById('currentCharacter');
    // 移除正确率相关元素
    const animateButton = document.getElementById('animateButton');
    const clearButton = document.getElementById('clearButton');
    const prevButton = document.getElementById('prevButton');
    const nextButton = document.getElementById('nextButton');
    // 移除对不存在元素的引用
    // const customCharInput = document.getElementById('customCharInput');
    // const addCustomCharButton = document.getElementById('addCustomChar');
    const loadingEl = document.getElementById('loading');
    const practiceAreaEl = document.getElementById('practiceArea');
    // 新增批量导入元素
    const batchImportInput = document.getElementById('batchImportInput');
    const batchImportButton = document.getElementById('batchImportButton');
    // 新增清空按钮元素
    const clearAllButton = document.getElementById('clearAllButton');
    // 新增速度控制元素
    const speedButton = document.getElementById('speedButton');
    const speedOptions = document.getElementById('speedOptions');
    const currentSpeedText = document.getElementById('currentSpeedText');

    // 初始化
    function init() {
      renderCharacterList();
      loadCharacter(currentIndex);
      
      // 事件监听
      animateButton.addEventListener('click', toggleAnimation);
      clearButton.addEventListener('click', () => {
        if (writer) writer.quiz();
      });
      prevButton.addEventListener('click', showPrevCharacter);
      nextButton.addEventListener('click', showNextCharacter);
      
      // 移除对不存在元素的引用
      // addCustomCharButton.addEventListener('click', addCustomCharacter);
      
      // 自定义汉字输入框回车键事件
      // customCharInput.addEventListener('keydown', (e) => {
      //   if (e.key === 'Enter') {
      //     addCustomCharacter();
      //   }
      // });
      
      // 批量导入事件监听
      batchImportButton.addEventListener('click', batchImportCharacters);
      
      // 确保清空按钮事件监听正确添加
      clearAllButton.addEventListener('click', clearAllCharacters);
      
      // 速度控制事件监听
      speedButton.addEventListener('click', toggleSpeedOptions);
      document.querySelectorAll('.speed-option').forEach(option => {
        option.addEventListener('click', setSpeed);
      });
      
      // 点击其他地方关闭速度选项
      document.addEventListener('click', (e) => {
        if (!speedButton.contains(e.target) && !speedOptions.contains(e.target)) {
          speedOptions.classList.add('hidden');
        }
      });
    }
    
    // 切换速度选项显示/隐藏
    function toggleSpeedOptions(e) {
      e.stopPropagation();
      speedOptions.classList.toggle('hidden');
    }
    
    // 设置速度
    function setSpeed() {
      const speed = parseFloat(this.getAttribute('data-speed'));
      currentSpeed = speed;
      
      // 更新速度显示文本
      if (speed === 0.5) {
        currentSpeedText.textContent = '慢';
      } else if (speed === 1.0) {
        currentSpeedText.textContent = '中';
      } else if (speed === 2.0) {
        currentSpeedText.textContent = '快';
      }
      
      speedOptions.classList.add('hidden');
      
      // 如果当前有汉字加载，重新加载以应用新速度
      if (writer) {
        loadCharacter(currentIndex);
      }
    }

    // 切换播放/暂停状态
    function toggleAnimation() {
      if (!writer) return;
      
      if (isAnimating) {
        // 当前正在播放，需要暂停
        pauseAnimation();
      } else {
        // 当前已暂停，需要播放
        playAnimation();
      }
    }

    // 播放动画
    function playAnimation() {
      if (!writer) return;
      
      try {
        // 更新按钮为暂停文字
        animateButton.innerHTML = `播放`;
        
        isAnimating = true;
        writer.cancelQuiz();
        
        // 保存动画Promise以便后续可以取消
        animationPromise = writer.animateCharacter();
        
        animationPromise.then(() => {
          // 动画完成后恢复播放按钮和状态
          resetAnimationState();
          setTimeout(() => {
            try {
              writer.quiz();
            } catch (error) {
              console.error('Error restarting quiz:', error);
            }
          }, 300);
        }).catch(error => {
          if (error.name !== 'CanceledPromiseError') {
            console.error('Error animating character:', error);
          }
          resetAnimationState();
        });
      } catch (error) {
        console.error('Error in playAnimation:', error);
        resetAnimationState();
      }
    }

    // 暂停动画
    function pauseAnimation() {
      if (!writer || !isAnimating) return;
      
      try {
        writer.cancelAnimation();
        resetAnimationState();
      } catch (error) {
        console.error('Error in pauseAnimation:', error);
        resetAnimationState();
      }
    }

    // 重置动画状态
    function resetAnimationState() {
      isAnimating = false;
      animationPromise = null;
      
      // 恢复播放按钮文字
      animateButton.innerHTML = `播放`;
    }

    // 演示笔顺动画 - 替换为新的toggleAnimation函数
    function animateCharacter() {
      if (!writer) return;
      
      try {
        writer.cancelQuiz();
        writer.animateCharacter().then(() => {
          setTimeout(() => {
            try {
              writer.quiz();
            } catch (error) {
              console.error('Error restarting quiz:', error);
            }
          }, 300);
        }).catch(error => {
          console.error('Error animating character:', error);
        });
      } catch (error) {
        console.error('Error in animateCharacter:', error);
      }
    }

    // 渲染字符列表
    function renderCharacterList() {
      characterListEl.innerHTML = '';
      characters.forEach((char, index) => {
        const charElement = document.createElement('div');
        charElement.classList.add('character-item', 'bg-gray-100', 'dark:bg-gray-700');
        if (index === currentIndex) {
          charElement.classList.add('bg-primary', 'text-white');
        }
        charElement.textContent = char;
        charElement.addEventListener('click', () => {
          currentIndex = index;
          loadCharacter(currentIndex);
          renderCharacterList();
        });
        characterListEl.appendChild(charElement);
      });
    }

    // 加载汉字
    function loadCharacter(index) {
      if (index < 0 || index >= characters.length) return;
      
      const char = characters[index];
      currentCharacterEl.textContent = `练习: ${char}`;
      
      // 显示加载中
      if (writer) {
        try {
          writer.destroy();
          writer = null;
        } catch (error) {
          console.error('Error destroying writer:', error);
        }
      }
      loadingEl.classList.remove('hidden');
      practiceAreaEl.classList.add('hidden');
      
      // 清空之前的内容
      document.getElementById('target').innerHTML = '';
      
      // 初始化 Hanzi Writer
      try {
        writer = HanziWriter.create('target', char, {
          width: 300,
          height: 300,
          padding: 5,
          strokeColor: '#FF0000', // 修改为红色
          radicalColor: '#FF0000', // 修改为红色
          highlightColor: '#3F3F3F',
          outlineColor: '#DDDDDD',
          drawingColor: '#FF0000', // 已经是红色
          drawingWidth: 30, // 粗线条
          showOutline: true,
          delayBetweenStrokes: 300,
          strokeAnimationSpeed: currentSpeed // 应用当前选择的速度
        });
      } catch (error) {
        console.error('Error creating writer:', error);
        loadingEl.classList.add('hidden');
        practiceAreaEl.classList.remove('hidden');
      }
      
      // 移除正确率设置
      
      // 设置 quiz 模式（描红练习）
      setTimeout(() => {
        loadingEl.classList.add('hidden');
        practiceAreaEl.classList.remove('hidden');
        if (writer) {
          try {
            writer.quiz({
              // 移除正确率回调
            });
          } catch (error) {
            console.error('Error starting quiz mode:', error);
          }
        }
      }, 500);
    }

    // 移除更新正确率显示函数
    function updateAccuracy(value) {
      const roundedValue = Math.round(value);
      accuracyBarEl.style.width = `${roundedValue}%`;
      accuracyTextEl.textContent = `${roundedValue}%`;
    }

    // 演示笔顺动画
    function animateCharacter() {
      if (!writer) return;
      
      try {
        writer.cancelQuiz();
        writer.animateCharacter().then(() => {
          setTimeout(() => {
            try {
              writer.quiz();
            } catch (error) {
              console.error('Error restarting quiz:', error);
            }
          }, 300);
        }).catch(error => {
          console.error('Error animating character:', error);
        });
      } catch (error) {
        console.error('Error in animateCharacter:', error);
      }
    }

    // 显示上一个字
    function showPrevCharacter() {
      if (currentIndex > 0) {
        currentIndex--;
        loadCharacter(currentIndex);
        renderCharacterList();
      }
    }

    // 显示下一个字
    function showNextCharacter() {
      if (currentIndex < characters.length - 1) {
        currentIndex++;
        loadCharacter(currentIndex);
        renderCharacterList();
      }
    }
    
    // 移除添加自定义汉字函数
    
    // 批量导入汉字功能
    function batchImportCharacters() {
      const input = batchImportInput.value.trim();
      if (!input) {
        alert('请输入要导入的汉字');
        return;
      }
      
      // 过滤出有效的汉字
      const validChars = Array.from(input).filter(char => /^[\u4e00-\u9fa5]$/.test(char));
      
      if (validChars.length === 0) {
        alert('未找到有效的汉字');
        return;
      }
      
      // 添加不重复的汉字（添加到数组开头）
      let addedCount = 0;
      // 反转数组以保持输入顺序（因为unshift会反转顺序）
      validChars.reverse().forEach(char => {
        if (!characters.includes(char)) {
          characters.unshift(char);
          addedCount++;
        }
      });
      
      if (addedCount > 0) {
        renderCharacterList();
        batchImportInput.value = '';
        
        // 自动切换到第一个新添加的汉字（现在是索引0）
        currentIndex = 0;
        loadCharacter(currentIndex);
        renderCharacterList();
        
        alert(`成功导入 ${addedCount} 个汉字`);
      } else {
        alert('所有汉字已存在，未添加新汉字');
      }
    }

    // 清空所有汉字
    function clearAllCharacters() {
      if (confirm('确定要清空所有汉字吗？')) {
        characters = [...defaultCharacters]; // 重置为默认汉字
        currentIndex = 0;
        renderCharacterList();
        loadCharacter(currentIndex);
      }
    }

    // 初始化应用
    document.addEventListener('DOMContentLoaded', init);
  </script>


</body></html>
