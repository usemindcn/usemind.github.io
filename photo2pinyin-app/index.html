<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片转文字拼音助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.18.1/dist/index.js"></script>
    <!-- 添加百度云OCR所需的库 -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                        secondary: '#FF6B6B',
                        tertiary: '#4ECDC4',
                        accent: '#FFD166',
                    },
                    animation: {
                        'bounce-slow': 'bounce 2s infinite',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-white dark:bg-gray-900 transition-colors duration-200">
    <!-- 添加卡通云朵背景 -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    
    <!-- 添加气泡效果 -->
    <div class="bubble" style="width: 30px; height: 30px; top: 20%; left: 5%;"></div>
    <div class="bubble" style="width: 20px; height: 20px; top: 30%; right: 10%;"></div>
    <div class="bubble" style="width: 40px; height: 40px; bottom: 15%; left: 15%;"></div>
    
    <div class="min-h-screen flex flex-col p-4 md:p-8 cartoon-bg">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold rainbow-text mb-2">照片转文字拼音助手</h1>
            <p class="text-gray-600 dark:text-gray-300 text-lg">上传照片，认识汉字和拼音！</p>
        </header>

        <main class="flex-grow flex flex-col items-center justify-start max-w-4xl mx-auto w-full">
            <!-- Upload Section -->
            <div class="w-full p-6 bg-indigo-50 dark:bg-indigo-900/20 rounded-xl shadow-md mb-8 rainbow-border">
                <div class="flex flex-col items-center">
                    <label for="photo-upload" class="cursor-pointer w-full">
                        <div class="flex flex-col items-center justify-center p-6 border-2 border-dashed border-primary dark:border-indigo-400 rounded-lg hover:bg-indigo-100 dark:hover:bg-indigo-800/30 transition-colors">
                            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='%235D5CDE' class='w-12 h-12'%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z'%3E%3C/path%3E%3Cpath stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M15 13a3 3 0 11-6 0 3 3 0 016 0z'%3E%3C/path%3E%3C/svg%3E" alt="相机图标" class="w-16 h-16 mb-2 float-animation">
                            <p class="text-primary dark:text-indigo-300 text-lg font-medium">点击这里选择照片</p>
                            <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">支持 JPG、PNG 格式</p>
                        </div>
                    </label>
                    <input type="file" id="photo-upload" accept="image/*" class="hidden">
                </div>
            </div>

            <!-- Preview Section -->
            <div id="preview-container" class="w-full hidden">
                <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-3">预览图片</h2>
                <div class="relative mb-6 bg-white dark:bg-gray-800 p-2 rounded-lg shadow-md">
                    <img id="image-preview" class="max-w-full rounded-lg mx-auto" alt="预览图片">
                    <button id="process-button" class="mt-4 mx-auto block cartoon-button btn-hover">
                        识别文字
                    </button>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loading" class="hidden flex-col items-center justify-center my-8">
                <div class="loading-bounce">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
                <p class="mt-4 text-lg text-gray-600 dark:text-gray-300">正在识别文字并添加拼音...</p>
            </div>

            <!-- Result Section -->
            <div id="result-container" class="w-full hidden">
                <h2 class="text-xl font-semibold text-gray-800 dark:text-gray-200 mb-3">识别结果</h2>
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-md">
                    <div id="text-result" class="text-center leading-loose mb-4"></div>
                    <div class="flex justify-center gap-4 mt-6">
                        <button id="read-aloud" class="bg-tertiary hover:bg-teal-500 text-white font-medium py-2 px-6 rounded-lg transition-colors flex items-center btn-hover btn-bounce">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                            </svg>
                            朗读文字
                        </button>
                        <button id="try-again" class="bg-accent hover:bg-yellow-500 text-gray-800 font-medium py-2 px-6 rounded-lg transition-colors flex items-center btn-hover btn-bounce">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            再试一次
                        </button>
                    </div>
                </div>
            </div>

            <!-- Error message -->
            <div id="error-message" class="hidden w-full mt-4 p-4 bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 rounded-lg"></div>
        </main>

        <footer class="mt-8 text-center text-gray-500 dark:text-gray-400 text-sm">
            <p>照片转文字拼音助手 - 帮助小朋友学习汉字</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
