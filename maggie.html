<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小朋友成长美人鱼</title>
  <style>
    :root {
      --bg1: #fff7fb;
      --bg2: #eefcff;
      --card: rgba(255,255,255,0.84);
      --text: #334155;
      --sub: #6b7280;
      --green: #43b66c;
      --red: #ff6b6b;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --blue: #38bdf8;
      --shadow: 0 10px 28px rgba(0,0,0,0.08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .topbar {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.78);
      text-align: center;
    }

    .stat .label {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .main {
      padding: 18px 14px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .hint {
      font-size: 14px;
      color: var(--sub);
      text-align: center;
      line-height: 1.5;
    }

    .ocean-stage {
      width: 100%;
      min-height: 260px;
      border-radius: 24px;
      background: linear-gradient(180deg, #dff6ff 0%, #dbeafe 45%, #e0f2fe 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .wave1, .wave2, .bubble1, .bubble2, .bubble3 {
      position: absolute;
    }

    .wave1 {
      left: -20px;
      right: -20px;
      bottom: 0;
      height: 72px;
      background: linear-gradient(180deg, #93c5fd, #60a5fa);
      border-radius: 40px 40px 0 0;
      opacity: 0.95;
    }

    .wave2 {
      left: 0;
      right: 0;
      bottom: 20px;
      height: 42px;
      background: rgba(255,255,255,0.28);
      border-radius: 999px;
    }

    .bubble1, .bubble2, .bubble3 {
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
    }

    .bubble1 {
      width: 16px;
      height: 16px;
      left: 40px;
      top: 45px;
      animation: bubbleFloat 4s ease-in-out infinite;
    }

    .bubble2 {
      width: 10px;
      height: 10px;
      right: 54px;
      top: 85px;
      animation: bubbleFloat 3.6s ease-in-out infinite;
    }

    .bubble3 {
      width: 22px;
      height: 22px;
      right: 90px;
      top: 36px;
      animation: bubbleFloat 4.5s ease-in-out infinite;
    }

    @keyframes bubbleFloat {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-10px); opacity: 1; }
    }

    .character-wrap {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: float 2.8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .character {
      font-size: 100px;
      line-height: 1;
      user-select: none;
    }

    .stage-name {
      margin-top: 8px;
      font-size: 21px;
      font-weight: 800;
      color: #374151;
    }

    .stage-desc {
      margin-top: 6px;
      font-size: 14px;
      color: var(--sub);
      line-height: 1.5;
    }

    .egg-selector {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .egg-card {
      border: 2px solid transparent;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      padding: 12px 6px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .egg-card:active {
      transform: scale(0.96);
    }

    .egg-card.selected {
      border-color: #f59e0b;
      background: #fff7d9;
    }

    .egg-emoji {
      font-size: 38px;
      display: block;
      margin-bottom: 6px;
    }

    .actions {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .actions h3,
    .history h3 {
      font-size: 16px;
      margin: 0 0 6px 0;
      color: #374151;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 18px;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .plus2 {
      background: linear-gradient(180deg, #4ade80, #22c55e);
    }

    .plus1 {
      background: linear-gradient(180deg, #60a5fa, #3b82f6);
    }

    .minus1 {
      background: linear-gradient(180deg, #fb7185, #f43f5e);
    }

    .minus2 {
      background: linear-gradient(180deg, #f87171, #ef4444);
    }

    .ghost {
      background: linear-gradient(180deg, #a78bfa, #8b5cf6);
    }

    .history {
      padding: 14px;
      margin-bottom: 8px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 180px;
      overflow: auto;
      margin-top: 8px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.9);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .tag-plus {
      color: var(--green);
      font-weight: 700;
    }

    .tag-minus {
      color: var(--red);
      font-weight: 700;
    }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .tiny {
      text-align: center;
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
      line-height: 1.5;
    }

    .burst {
      position: absolute;
      z-index: 5;
      font-size: 30px;
      animation: burstUp 1s ease forwards;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes burstUp {
      0% {
        transform: translateY(0) scale(0.7);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-70px) scale(1.08);
        opacity: 0;
      }
    }

    .evolve-glow {
      animation: glow 0.7s ease 2;
    }

    @keyframes glow {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 0 rgba(236, 72, 153, 0));
      }
      50% {
        transform: scale(1.12);
        filter: drop-shadow(0 0 18px rgba(236, 72, 153, 0.85));
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 0 0 rgba(236, 72, 153, 0));
      }
    }

    @media (max-width: 380px) {
      .character {
        font-size: 88px;
      }

      .action-grid {
        grid-template-columns: 1fr;
      }

      .egg-selector {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar card">
      <div class="stat">
        <div class="label">当前分数</div>
        <div class="value" id="scoreValue">0</div>
      </div>
      <div class="stat">
        <div class="label">当前等级</div>
        <div class="value" id="levelValue">1级</div>
      </div>
    </div>

    <div class="main card">
      <div class="hint" id="topHint">先选一个喜欢的蛋，开启你的海洋精灵成长之旅。</div>

      <div class="ocean-stage" id="stageBox">
        <div class="bubble1"></div>
        <div class="bubble2"></div>
        <div class="bubble3"></div>
        <div class="wave2"></div>
        <div class="wave1"></div>

        <div class="character-wrap" id="characterWrap">
          <div class="character" id="characterEmoji">🥚</div>
          <div class="stage-name" id="stageName">一级：魔法贝壳蛋</div>
          <div class="stage-desc" id="stageDesc">请选择下方 4 个蛋中的一个，开启你的海洋精灵之旅</div>
        </div>
      </div>

      <div class="egg-selector" id="eggSelector"></div>
    </div>

    <div class="actions card">
      <h3>加分项 / 减分项</h3>
      <div class="action-grid">
        <button class="btn plus2" onclick="changeScore(2, '作业完成')">作业完成 +2</button>
        <button class="btn plus1" onclick="changeScore(1, '表现好')">表现好 +1</button>
        <button class="btn minus1" onclick="changeScore(-1, '表现差')">表现差 -1</button>
        <button class="btn minus2" onclick="changeScore(-2, '作业没完成')">作业没完成 -2</button>
      </div>
      <div class="footer-actions">
        <button class="btn ghost" onclick="resetToday()">重置分数</button>
        <button class="btn ghost" onclick="clearAllData()">清空全部</button>
      </div>
      <div class="tiny">数据会自动保存在本机浏览器里，下次打开还在。</div>
    </div>

    <div class="history card">
      <h3>成长记录</h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'mike_mermaid_growth_game_v1';

    const eggs = [
      { id: 1, emoji: '🥚', name: '珍珠蛋' },
      { id: 2, emoji: '🪺', name: '珊瑚蛋' },
      { id: 3, emoji: '🥚', name: '海星蛋' },
      { id: 4, emoji: '🪺', name: '月光蛋' }
    ];

    const stages = [
      { level: 1, min: 0, max: 9, emoji: '🥚', name: '一级：魔法贝壳蛋', desc: '小精灵正在蛋里悄悄积蓄魔法能量' },
      { level: 2, min: 10, max: 19, emoji: '🧚', name: '二级：小海精灵', desc: '已经苏醒，开始在海洋世界里探索成长' },
      { level: 3, min: 20, max: 29, emoji: '🧜', name: '三级：小人鱼宝宝', desc: '尾巴和魔法都变得更明显了，越来越可爱' },
      { level: 4, min: 30, max: 39, emoji: '🧜‍♀️', name: '四级：青春期小美人鱼', desc: '正在蜕变，变得更优雅、更自信' },
      { level: 5, min: 40, max: 50, emoji: '✨🧜‍♀️', name: '五级：绝美美人鱼', desc: '已经进化成非常非常美丽的美人鱼啦' },
      { level: 6, min: 51, max: Infinity, emoji: '👑🧜‍♀️', name: '六级：皇冠美人鱼女王', desc: '顶级进化完成，成为戴皇冠的美人鱼女王' }
    ];

    let state = {
      score: 0,
      eggId: null,
      history: []
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = JSON.parse(raw);
      } catch (e) {}
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getLevelByScore(score) {
      return stages.find(s => score >= s.min && score <= s.max) || stages[0];
    }

    function getEggName(id) {
      return eggs.find(e => e.id === id)?.name || '未选蛋';
    }

    function renderEggs() {
      const wrap = document.getElementById('eggSelector');
      wrap.innerHTML = '';
      const isLocked = !!state.eggId;

      eggs.forEach(egg => {
        const div = document.createElement('div');
        div.className = 'egg-card' + (state.eggId === egg.id ? ' selected' : '');
        div.innerHTML = `
          <span class="egg-emoji">${egg.emoji}</span>
          <div>${egg.name}</div>
        `;
        div.onclick = () => {
          if (isLocked) return;
          state.eggId = egg.id;
          state.history.unshift(makeHistory('领取了 ' + egg.name, '+0'));
          saveState();
          renderAll();
          showBurst('✨已领取');
        };
        wrap.appendChild(div);
      });
    }

    function makeHistory(label, delta) {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      return {
        label,
        delta,
        time: `${mm}-${dd} ${hh}:${mi}`
      };
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';

      if (!state.history.length) {
        const empty = document.createElement('div');
        empty.className = 'history-item';
        empty.innerHTML = `<span>还没有记录，快开始成长吧～</span><span></span>`;
        list.appendChild(empty);
        return;
      }

      state.history.slice(0, 20).forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const cls = item.delta.startsWith('-') ? 'tag-minus' : 'tag-plus';
        row.innerHTML = `
          <div>
            <div>${item.label}</div>
            <div style="font-size:12px;color:#7c8a7f;margin-top:4px;">${item.time}</div>
          </div>
          <div class="${cls}">${item.delta}</div>
        `;
        list.appendChild(row);
      });
    }

    function renderStage(leveledUp = false) {
      const level = getLevelByScore(state.score);
      const selectedEgg = eggs.find(e => e.id === state.eggId);
      const scoreValue = document.getElementById('scoreValue');
      const levelValue = document.getElementById('levelValue');
      const characterEmoji = document.getElementById('characterEmoji');
      const stageName = document.getElementById('stageName');
      const stageDesc = document.getElementById('stageDesc');
      const topHint = document.getElementById('topHint');
      const characterWrap = document.getElementById('characterWrap');

      scoreValue.textContent = state.score;
      levelValue.textContent = `${level.level}级`;

      let displayEmoji = level.emoji;
      let displayDesc = level.desc;

      if (level.level === 1 && state.eggId) {
        displayEmoji = selectedEgg?.emoji || '🥚';
        displayDesc = `${selectedEgg?.name || '魔法蛋'} 已经选定，继续加分就会孵化`;
      }

      characterEmoji.textContent = displayEmoji;
      stageName.textContent = level.name;
      stageDesc.textContent = displayDesc;

      if (!state.eggId) {
        topHint.textContent = '先选一个喜欢的蛋，开启你的海洋精灵成长之旅。';
      } else {
        topHint.textContent = `当前伙伴：${getEggName(state.eggId)} ｜ 继续努力，它会自动进化成更美的海洋精灵。`;
      }

      if (leveledUp) {
        characterWrap.classList.remove('evolve-glow');
        void characterWrap.offsetWidth;
        characterWrap.classList.add('evolve-glow');
      }
    }

    function renderAll(leveledUp = false) {
      renderEggs();
      renderStage(leveledUp);
      renderHistory();
    }

    function showBurst(text) {
      const stageBox = document.getElementById('stageBox');
      const div = document.createElement('div');
      div.className = 'burst';
      div.textContent = text;
      div.style.left = '50%';
      div.style.top = '48%';
      div.style.transform = 'translateX(-50%)';
      stageBox.appendChild(div);
      setTimeout(() => div.remove(), 1000);
    }

    function changeScore(delta, label) {
      if (!state.eggId) {
        alert('请先在上方选择一个蛋，再开始加分或扣分。');
        return;
      }

      const oldLevel = getLevelByScore(state.score).level;
      state.score += delta;

      if (state.score < 0) state.score = 0;

      const actualDelta = (delta >= 0 ? '+' : '') + delta;
      state.history.unshift(makeHistory(label, actualDelta));

      if (state.history.length > 100) {
        state.history = state.history.slice(0, 100);
      }

      const newLevel = getLevelByScore(state.score).level;
      saveState();
      renderAll(newLevel > oldLevel);

      if (delta > 0) showBurst(`+${delta}`);
      else showBurst(`${delta}`);

      if (newLevel > oldLevel) {
        setTimeout(() => {
          alert(`恭喜升级到 ${newLevel} 级！\n你的海洋精灵进化啦！`);
        }, 80);
      }
    }

    function resetToday() {
      if (!confirm('确定要把分数重置为 0 分吗？蛋会保留。')) return;
      state.score = 0;
      state.history.unshift(makeHistory('重置分数', '+0'));
      saveState();
      renderAll();
    }

    function clearAllData() {
      if (!confirm('确定清空全部数据吗？分数、记录、已领取的蛋都会清除。')) return;
      state = {
        score: 0,
        eggId: null,
        history: []
      };
      saveState();
      renderAll();
    }

    loadState();
    renderAll();
  </script>
</body>
</html>
