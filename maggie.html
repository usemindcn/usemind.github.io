<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maggie小红花计数器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF85A1',
                        secondary: '#FFC0D3',
                        accent: '#FF5C8D',
                        girl: {
                            pink: '#FF85A1',
                            lightpink: '#FFC0D3',
                            hotpink: '#FF5C8D',
                            lavender: '#E6E6FA',
                            peach: '#FFDAB9',
                            blush: '#FFB6C1',
                        },
                        pastel: {
                            green: '#9DDAC6',
                            blue: '#98D1EB',
                            yellow: '#FFE082',
                            pink: '#FFB6C1',
                            purple: '#D8BFD8'
                        }
                    },
                    borderRadius: {
                        'xl': '1rem',
                        '2xl': '1.5rem',
                        '3xl': '2rem'
                    }
                }
            },
            darkMode: 'class'
        }
    </script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFE6EE; /* 更简洁的浅粉色 */
        }
        
        .dark body {
            background-color: #332E3C; /* 暗色模式下的深紫粉色 */
        }
        
        .score-change {
            position: absolute;
            animation: float-up 1s forwards;
            font-weight: bold;
            pointer-events: none;
            font-size: 1.2rem;
        }
        
        @keyframes float-up {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-40px);
            }
        }
        
        .card {
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(255, 133, 161, 0.15);
            transition: all 0.3s;
            border: 3px solid transparent;
        }
        
        .card:hover {
            transform: translateY(-5px);
        }
        
        .score-card {
            background-color: white;
            border-color: #FFC0D3;
        }
        
        .timer-card {
            background-color: white;
            border-color: #98D1EB;
        }
        
        .dark .score-card {
            background-color: #2D2A33;
            color: white;
            border-color: #FF85A1;
        }
        
        .dark .timer-card {
            background-color: #2D2A33;
            color: white;
            border-color: #74c0e3;
        }
        
        .button-container {
            position: relative;
        }

        .flower {
            display: inline-block;
            color: #FF5C8D;
            font-size: 1.5rem;
            animation: appear 0.5s ease-out;
            margin: 0 2px;
            filter: drop-shadow(0 0 2px rgba(255, 92, 141, 0.3));
        }
        
        @keyframes appear {
            0% {
                transform: scale(0) rotate(-45deg);
                opacity: 0;
            }
            70% {
                transform: scale(1.2) rotate(15deg);
            }
            100% {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        .flower-icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            vertical-align: middle;
        }
        
        .cute-button {
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(255, 133, 161, 0.2);
            transition: all 0.2s;
            transform: translateY(0);
        }
        
        .cute-button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 2px rgba(255, 133, 161, 0.1);
        }
        
        .add-button {
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            transform: translateY(0);
        }
        
        .add-button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.1);
        }
        
        .bounce {
            animation: bounce 0.5s;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        
        #toggle-sound {
            transition: all 0.3s ease;
        }
        
        #toggle-sound:hover {
            transform: scale(1.1);
        }
        
        .sound-status {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        
        .show-status {
            opacity: 1;
        }
        
        /* 奖品模态窗口 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.8);
            transition: transform 0.3s;
            box-shadow: 0 10px 25px rgba(255, 133, 161, 0.3);
            border: 3px solid #FFC0D3;
        }
        
        .dark .modal-content {
            background-color: #2D2A33;
            color: white;
            border-color: #FF85A1;
        }
        
        .modal.show .modal-content {
            transform: scale(1);
        }
        
        .reward-item {
            border: 2px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .reward-item:hover {
            transform: translateY(-3px);
        }
        
        .reward-item.selected {
            border-color: #FF85A1;
            background-color: rgba(255, 133, 161, 0.1);
        }
        
        .dark .reward-item.selected {
            background-color: rgba(255, 133, 161, 0.2);
        }
        
        .reward-price {
            display: flex;
            align-items: center;
            font-weight: bold;
            color: #FF5C8D;
        }
        
        .reward-price .flower {
            font-size: 1rem;
            margin-left: 4px;
        }
        
        .reward-image {
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.5s;
        }
        
        @keyframes success-animation {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .success-animation {
            animation: success-animation 0.5s;
        }
        
        .exchange-notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 15px 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(255, 133, 161, 0.3);
            z-index: 100;
            display: none;
            border: 2px solid #FFC0D3;
        }
        
        .dark .exchange-notification {
            background-color: #2D2A33;
            color: white;
            border-color: #FF85A1;
        }
        
        .notification-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .btn-pink-gradient {
            background: linear-gradient(to right, #FF85A1, #FF5C8D);
        }
        
        .btn-pink-gradient:hover {
            background: linear-gradient(to right, #FF7694, #FF4D7E);
        }
    </style>
</head>
<body>
    <div class="container mx-auto p-4 max-w-md">
        <h1 class="text-3xl font-bold text-center text-girl-hotpink dark:text-girl-lightpink mb-6">
            Maggie小红花计数器
            <span class="flower">🌺</span>
        </h1>
        
        <!-- 总分数显示 -->
        <div class="card score-card p-6 mb-6 text-center transition-colors duration-300">
            <h2 class="text-xl text-girl-hotpink dark:text-girl-lightpink mb-3 font-bold">小红花总数</h2>
            <div class="flex justify-center items-center">
                <div class="text-5xl font-bold text-girl-hotpink" id="total-score">0</div>
            </div>
            <div id="flowers-container" class="mt-4 min-h-16 flex flex-wrap justify-center"></div>
            
            <!-- 兑换按钮 -->
            <button id="exchange-button" class="mt-4 btn-pink-gradient text-white font-bold py-2 px-6 rounded-full shadow-lg transform transition-all duration-300 hover:scale-105">
                <span class="flex items-center justify-center">
                    🎁 兑换奖品
                </span>
            </button>
        </div>
        
        <!-- 计时器 -->
        <div class="card timer-card p-5 mb-6 transition-colors duration-300">
            <h2 class="text-xl text-blue-600 dark:text-blue-300 mb-3 text-center font-bold">学习时间</h2>
            <div class="text-3xl font-mono text-center text-gray-700 dark:text-gray-100" id="timer">00:00:00</div>
            <div class="flex justify-center mt-4 space-x-3">
                <button id="start-timer" class="cute-button bg-pastel-green hover:bg-green-400 text-green-800 font-medium py-2 px-4 rounded-xl">
                    <span class="flex items-center">▶️ 开始</span>
                </button>
                <button id="pause-timer" class="cute-button bg-pastel-yellow hover:bg-yellow-300 text-yellow-800 font-medium py-2 px-4 rounded-xl">
                    <span class="flex items-center">⏸️ 暂停</span>
                </button>
                <button id="reset-timer" class="cute-button bg-pastel-pink hover:bg-red-300 text-red-800 font-medium py-2 px-4 rounded-xl">
                    <span class="flex items-center">🔄 重置</span>
                </button>
            </div>
        </div>
        
        <!-- 加分项 -->
        <div class="mb-5">
            <h2 class="text-xl font-bold mb-3 text-girl-hotpink dark:text-girl-lightpink flex items-center">
                <span class="mr-2">✨</span>加分项<span class="ml-2">✨</span>
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="button-container">
                    <button data-points="2" class="add-button w-full bg-gradient-to-br from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">🧍‍♀️ 坐姿端正 +2</span>
                    </button>
                </div>
                <div class="button-container">
                    <button data-points="1" class="add-button w-full bg-gradient-to-br from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">✅ 回答正确 +1</span>
                    </button>
                </div>
                <div class="button-container">
                    <button data-points="3" class="add-button w-full bg-gradient-to-br from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">📚 专心学习 +3</span>
                    </button>
                </div>
                <div class="button-container">
                    <button data-points="5" class="add-button w-full bg-gradient-to-br from-green-400 to-green-500 hover:from-green-500 hover:to-green-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">🎉 完成作业 +5</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 扣分项 -->
        <div class="mb-5">
            <h2 class="text-xl font-bold mb-3 text-pink-600 dark:text-pink-300 flex items-center">
                <span class="mr-2">⚠️</span>扣分项<span class="ml-2">⚠️</span>
            </h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="button-container">
                    <button data-points="-1" class="add-button w-full bg-gradient-to-br from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">😖 坐姿不端正 -1</span>
                    </button>
                </div>
                <div class="button-container">
                    <button data-points="-2" class="add-button w-full bg-gradient-to-br from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">🙄 走神 -2</span>
                    </button>
                </div>
                <div class="button-container">
                    <button data-points="-3" class="add-button w-full bg-gradient-to-br from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">🎮 做其他事情 -3</span>
                    </button>
                </div>
                <div class="button-container">
                    <button data-points="-5" class="add-button w-full bg-gradient-to-br from-pink-400 to-pink-500 hover:from-pink-500 hover:to-pink-600 text-white font-medium py-3 px-4 rounded-xl">
                        <span class="flex items-center justify-center">❌ 拒绝完成 -5</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="py-3 text-center text-girl-hotpink dark:text-girl-lightpink text-sm">
            🌟 用爱和鼓励陪伴 Maggie 成长 🌟
        </div>
    </div>
    
    <!-- 兑换奖品模态窗口 -->
    <div id="rewards-modal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-girl-hotpink dark:text-girl-lightpink">奖品兑换中心</h2>
                <button id="close-modal" class="text-gray-600 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 text-2xl">
                    &times;
                </button>
            </div>
            
            <p class="text-gray-600 dark:text-gray-300 mb-4">
                Maggie 当前的小红花: <span id="modal-flower-count" class="font-bold text-girl-hotpink">0</span>
            </p>
            
            <div class="grid grid-cols-2 gap-4 mb-4" id="rewards-container">
                <!-- 奖品将通过JS动态生成 -->
            </div>
            
            <div id="reward-detail" class="hidden p-4 bg-girl-lavender dark:bg-gray-800 rounded-xl mt-4">
                <h3 id="detail-title" class="text-xl font-bold mb-2 text-girl-hotpink dark:text-girl-lightpink">奖品名称</h3>
                <p id="detail-description" class="text-gray-600 dark:text-gray-300 mb-3">奖品描述...</p>
                <div class="flex justify-between items-center">
                    <div class="flex items-center">
                        <span>价格: </span>
                        <span id="detail-price" class="font-bold text-girl-hotpink ml-1">20</span>
                        <span class="ml-1">🌺</span>
                    </div>
                    <button id="confirm-exchange" class="bg-gradient-to-r from-girl-pink to-girl-hotpink hover:from-girl-hotpink hover:to-girl-pink text-white font-bold py-2 px-4 rounded-lg">
                        确认兑换
                    </button>
                </div>
            </div>
            
            <p class="text-gray-500 dark:text-gray-400 text-sm mt-4 text-center">
                点击奖品查看详情并兑换
            </p>
        </div>
    </div>
    
    <!-- 兑换结果通知 -->
    <div id="exchange-notification" class="exchange-notification">
        <div class="text-center">
            <div id="notification-icon" class="notification-icon">🎉</div>
            <div id="notification-message" class="font-bold text-lg">兑换成功!</div>
        </div>
    </div>
    
    <!-- 声音控制按钮 -->
    <div class="fixed bottom-3 right-3 z-10 relative">
        <div id="sound-status" class="sound-status">点击启用声音</div>
        <button id="toggle-sound" class="bg-white dark:bg-gray-800 p-3 rounded-full shadow-md hover:bg-girl-peach dark:hover:bg-gray-700">
            <span id="sound-icon" class="text-xl">🔊</span>
        </button>
    </div>

    <script>
        // 检测暗黑模式
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // 初始化变量
        let score = 0;
        let timerInterval = null;
        let seconds = 0;
        let isRunning = false;
        let selectedReward = null;
        
        // 奖品列表
        const rewards = [
            { id: 1, name: '糖果', emoji: '🍬', description: '美味的糖果，小小的甜蜜！', price: 25 },
            { id: 2, name: '动画片20分钟', emoji: '📺', description: '看20分钟你最喜欢的动画片！', price: 50 },
            { id: 3, name: '饮料', emoji: '🥤', description: '好喝的饮料，解渴又美味！', price: 70 },
            { id: 4, name: '冰淇淋', emoji: '🍦', description: '美味的冰淇淋，甜蜜清凉的享受！', price: 100 },
            { id: 5, name: '旋转木马', emoji: '🎠', description: '坐旋转木马，童话般的美好体验！', price: 150 },
            { id: 6, name: '汉堡', emoji: '🍔', description: '美味的汉堡，大大的满足！', price: 200 }
        ];
        
        // 获取DOM元素
        const totalScoreEl = document.getElementById('total-score');
        const timerEl = document.getElementById('timer');
        const startBtn = document.getElementById('start-timer');
        const pauseBtn = document.getElementById('pause-timer');
        const resetBtn = document.getElementById('reset-timer');
        const addButtons = document.querySelectorAll('.add-button');
        const flowersContainer = document.getElementById('flowers-container');
        const toggleSoundBtn = document.getElementById('toggle-sound');
        const soundIcon = document.getElementById('sound-icon');
        const soundStatus = document.getElementById('sound-status');
        
        // 兑换奖品相关元素
        const rewardsModal = document.getElementById('rewards-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const exchangeBtn = document.getElementById('exchange-button');
        const rewardsContainer = document.getElementById('rewards-container');
        const modalFlowerCount = document.getElementById('modal-flower-count');
        const rewardDetail = document.getElementById('reward-detail');
        const detailTitle = document.getElementById('detail-title');
        const detailDescription = document.getElementById('detail-description');
        const detailPrice = document.getElementById('detail-price');
        const confirmExchangeBtn = document.getElementById('confirm-exchange');
        const exchangeNotification = document.getElementById('exchange-notification');
        const notificationIcon = document.getElementById('notification-icon');
        const notificationMessage = document.getElementById('notification-message');
        
        // 声音设置
        let isSoundOn = true;
        let soundsInitialized = false;
        let sounds = {
            clap1: null,
            clap2: null, 
            clap3: null,
            regret1: null,
            regret2: null,
            bgm: null,
            success: null,
            error: null,
            click: null
        };
        
        // 创建音频对象
        function initSounds() {
            if (soundsInitialized) return;
            
            // 使用公共CDN的音频
            sounds.clap1 = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-achievement-bell-600.mp3');
            sounds.clap2 = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-cartoon-positive-sound-2255.mp3');
            sounds.clap3 = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-animated-small-group-applause-523.mp3');
            sounds.regret1 = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-wrong-answer-fail-notification-946.mp3');
            sounds.regret2 = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-game-show-wrong-answer-buzz-950.mp3');
            sounds.bgm = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/happy-ukulele-93768.mp3');
            sounds.success = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-magical-coin-win-1936.mp3');
            sounds.error = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-alert-quick-chime-766.mp3');
            sounds.click = new Audio('https://cdn.jsdelivr.net/gh/mozibrishu/audio@latest/mixkit-select-click-1109.mp3');
            
            // 配置循环播放
            sounds.bgm.loop = true;
            sounds.bgm.volume = 0.2;
            
            soundsInitialized = true;
            
            // 显示声音状态通知
            showSoundStatus('声音已启用！');
        }
        
        // 显示声音状态通知
        function showSoundStatus(message) {
            soundStatus.textContent = message;
            soundStatus.classList.add('show-status');
            setTimeout(() => {
                soundStatus.classList.remove('show-status');
            }, 2000);
        }
        
        // 更新分数显示
        function updateScoreDisplay() {
            totalScoreEl.textContent = score;
            totalScoreEl.classList.add('bounce');
            setTimeout(() => {
                totalScoreEl.classList.remove('bounce');
            }, 500);
            modalFlowerCount.textContent = score;
            updateFlowers();
        }
        
        // 更新小红花显示
        function updateFlowers() {
            flowersContainer.innerHTML = '';
            const flowerCount = Math.max(0, score); // 确保不显示负数的花
            for (let i = 0; i < flowerCount; i++) {
                const flower = document.createElement('span');
                flower.className = 'flower';
                flower.textContent = '🌺';
                // 增加一点随机延迟，让花朵出现更自然
                setTimeout(() => {
                    flowersContainer.appendChild(flower);
                }, i * 100);
            }
        }

        // 格式化时间
        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const secs = totalSeconds % 60;
            
            return [
                hours.toString().padStart(2, '0'),
                minutes.toString().padStart(2, '0'),
                secs.toString().padStart(2, '0')
            ].join(':');
        }
        
        // 更新计时器
        function updateTimer() {
            seconds++;
            timerEl.textContent = formatTime(seconds);
        }
        
        // 开始计时器
        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                timerInterval = setInterval(updateTimer, 1000);
                startBtn.classList.add('bg-opacity-50');
                pauseBtn.classList.remove('bg-opacity-50');
                // 初始化声音
                initSounds();
                // 播放背景音乐
                playBGM();
            }
        }
        
        // 暂停计时器
        function pauseTimer() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
                pauseBtn.classList.add('bg-opacity-50');
                startBtn.classList.remove('bg-opacity-50');
            }
        }
        
        // 重置计时器
        function resetTimer() {
            pauseTimer();
            seconds = 0;
            timerEl.textContent = formatTime(seconds);
        }
        
        // 显示分数变化动画
        function showScoreChange(button, points) {
            const scoreChange = document.createElement('div');
            scoreChange.className = 'score-change';
            scoreChange.textContent = points > 0 ? `+${points}` : points;
            scoreChange.style.color = points > 0 ? '#FF5C8D' : '#F44336';
            
            button.parentElement.appendChild(scoreChange);
            
            // 定位在按钮上方中央
            const buttonRect = button.getBoundingClientRect();
            
            scoreChange.style.left = `${buttonRect.width / 2 - scoreChange.offsetWidth / 2}px`;
            scoreChange.style.top = `${-scoreChange.offsetHeight}px`;
            
            // 移除元素
            setTimeout(() => {
                scoreChange.remove();
            }, 1000);
        }
        
        // 播放掌声（根据分值选择不同的掌声强度）
        function playClap(points) {
            if (!isSoundOn || !soundsInitialized) return;
            
            try {
                if (points === 1) {
                    sounds.clap1.currentTime = 0;
                    sounds.clap1.play();
                } else if (points <= 3) {
                    sounds.clap2.currentTime = 0;
                    sounds.clap2.play();
                } else {
                    sounds.clap3.currentTime = 0;
                    sounds.clap3.play();
                }
            } catch(e) {
                console.log("播放掌声失败:", e);
            }
        }
        
        // 播放遗憾声音（根据扣分值选择不同的遗憾声音）
        function playRegret(points) {
            if (!isSoundOn || !soundsInitialized) return;
            
            try {
                if (points >= -2) {
                    sounds.regret1.currentTime = 0;
                    sounds.regret1.play();
                } else {
                    sounds.regret2.currentTime = 0;
                    sounds.regret2.play();
                }
            } catch(e) {
                console.log("播放遗憾声音失败:", e);
            }
        }
        
        // 播放成功声音
        function playSuccess() {
            if (!isSoundOn || !soundsInitialized) return;
            
            try {
                sounds.success.currentTime = 0;
                sounds.success.play();
            } catch(e) {
                console.log("播放成功声音失败:", e);
            }
        }
        
        // 播放错误声音
        function playError() {
            if (!isSoundOn || !soundsInitialized) return;
            
            try {
                sounds.error.currentTime = 0;
                sounds.error.play();
            } catch(e) {
                console.log("播放错误声音失败:", e);
            }
        }
        
        // 播放点击声音
        function playClick() {
            if (!isSoundOn || !soundsInitialized) return;
            
            try {
                sounds.click.currentTime = 0;
                sounds.click.play();
            } catch(e) {
                console.log("播放点击声音失败:", e);
            }
        }
        
        // 播放背景音乐
        function playBGM() {
            if (!isSoundOn || !soundsInitialized) return;
            
            try {
                sounds.bgm.play().catch(e => {
                    console.log("播放背景音乐失败:", e);
                    showSoundStatus('请点击页面启用声音');
                });
            } catch(e) {
                console.log("播放背景音乐失败:", e);
            }
        }
        
        // 切换声音
        function toggleSound() {
            if (!soundsInitialized) {
                initSounds();
                return;
            }
            
            isSoundOn = !isSoundOn;
            
            if (isSoundOn) {
                soundIcon.textContent = '🔊';
                playBGM();
                showSoundStatus('声音已开启');
            } else {
                soundIcon.textContent = '🔇';
                if (sounds.bgm) {
                    sounds.bgm.pause();
                }
                showSoundStatus('声音已关闭');
            }
        }
        
        // 打开奖品模态窗口
        function openRewardsModal() {
            playClick();
            rewardsModal.classList.add('show');
            modalFlowerCount.textContent = score;
            renderRewards();
        }
        
        // 关闭奖品模态窗口
        function closeRewardsModal() {
            playClick();
            rewardsModal.classList.remove('show');
            rewardDetail.classList.add('hidden');
            selectedReward = null;
            
            // 移除选中状态
            document.querySelectorAll('.reward-item').forEach(item => {
                item.classList.remove('selected');
            });
        }
        
        // 渲染奖品列表
        function renderRewards() {
            rewardsContainer.innerHTML = '';
            
            rewards.forEach(reward => {
                const rewardItem = document.createElement('div');
                rewardItem.className = 'reward-item rounded-xl p-3 bg-white dark:bg-gray-700 shadow-md';
                rewardItem.dataset.id = reward.id;
                
                rewardItem.innerHTML = `
                    <div class="reward-image mb-2">${reward.emoji}</div>
                    <h3 class="font-bold text-gray-800 dark:text-gray-100 text-center mb-1">${reward.name}</h3>
                    <div class="reward-price justify-center">
                        <span>${reward.price}</span>
                        <span class="flower">🌺</span>
                    </div>
                `;
                
                rewardItem.addEventListener('click', () => {
                    selectReward(reward);
                });
                
                rewardsContainer.appendChild(rewardItem);
            });
        }
        
        // 选择奖品
        function selectReward(reward) {
            playClick();
            
            // 移除其他项的选中状态
            document.querySelectorAll('.reward-item').forEach(item => {
                item.classList.remove('selected');
            });
            
            // 添加选中状态到当前项
            const selectedItem = document.querySelector(`.reward-item[data-id="${reward.id}"]`);
            if (selectedItem) {
                selectedItem.classList.add('selected');
            }
            
            // 更新详情区域
            selectedReward = reward;
            detailTitle.textContent = reward.name;
            detailDescription.textContent = reward.description;
            detailPrice.textContent = reward.price;
            
            // 显示详情区域
            rewardDetail.classList.remove('hidden');
        }
        
        // 确认兑换奖品
        function confirmExchange() {
            if (!selectedReward) return;
            
            if (score >= selectedReward.price) {
                // 扣减分数
                score -= selectedReward.price;
                updateScoreDisplay();
                
                // 显示成功通知
                showExchangeNotification(true, `成功兑换 ${selectedReward.name}！`);
                playSuccess();
                
                // 关闭模态窗口
                setTimeout(() => {
                    closeRewardsModal();
                }, 500);
            } else {
                // 余额不足，显示错误
                showExchangeNotification(false, `小红花不足，还需要 ${selectedReward.price - score} 朵小红花`);
                
                // 显示分数抖动动画
                modalFlowerCount.classList.add('shake');
                setTimeout(() => {
                    modalFlowerCount.classList.remove('shake');
                }, 500);
                
                playError();
            }
        }
        
        // 显示兑换通知
        function showExchangeNotification(success, message) {
            notificationIcon.textContent = success ? '🎉' : '❗';
            notificationMessage.textContent = message;
            exchangeNotification.style.display = 'block';
            exchangeNotification.classList.add('success-animation');
            
            setTimeout(() => {
                exchangeNotification.classList.remove('success-animation');
                exchangeNotification.style.display = 'none';
            }, 2000);
        }
        
        // 事件监听器
        startBtn.addEventListener('click', startTimer);
        pauseBtn.addEventListener('click', pauseTimer);
        resetBtn.addEventListener('click', resetTimer);
        toggleSoundBtn.addEventListener('click', toggleSound);
        exchangeBtn.addEventListener('click', openRewardsModal);
        closeModalBtn.addEventListener('click', closeRewardsModal);
        confirmExchangeBtn.addEventListener('click', confirmExchange);
        
        // 点击模态窗口背景关闭
        rewardsModal.addEventListener('click', (e) => {
            if (e.target === rewardsModal) {
                closeRewardsModal();
            }
        });
        
        // 初始化点击事件监听
        document.addEventListener('click', function initOnFirstClick() {
            // 初始化声音系统
            initSounds();
            // 移除监听器，防止重复初始化
            document.removeEventListener('click', initOnFirstClick);
        }, { once: true });
        
        // 加/扣分按钮事件
        addButtons.forEach(button => {
            button.addEventListener('click', () => {
                const points = parseInt(button.dataset.points);
                score += points;
                showScoreChange(button, points);
                updateScoreDisplay();
                
                // 添加按钮动画
                button.classList.add('scale-95');
                setTimeout(() => {
                    button.classList.remove('scale-95');
                }, 200);
                
                // 确保音频已初始化
                if (!soundsInitialized) {
                    initSounds();
                }
                
                // 播放相应的声音
                if (points > 0) {
                    playClap(points);
                } else {
                    playRegret(points);
                }
            });
        });
        
        // 初始化显示
        updateScoreDisplay();
        
        // 显示初始提示
        soundStatus.classList.add('show-status');
        setTimeout(() => {
            soundStatus.classList.remove('show-status');
        }, 3000);
    </script>
</body>
</html>
