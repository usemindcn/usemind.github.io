<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小朋友成长养成游戏</title>
  <style>
    :root {
      --bg1: #fff8fc;
      --bg2: #eefbff;
      --card: rgba(255,255,255,0.86);
      --text: #334155;
      --sub: #6b7280;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #60a5fa;
      --purple: #8b5cf6;
      --pink: #ec4899;
      --shadow: 0 10px 28px rgba(0,0,0,0.08);
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .app {
      width: 100%;
      max-width: 460px;
      min-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .topbar {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stat {
      padding: 12px;
      border-radius: 18px;
      background: rgba(255,255,255,0.8);
      text-align: center;
    }

    .stat .label {
      font-size: 13px;
      color: var(--sub);
      margin-bottom: 6px;
    }

    .stat .value {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
    }

    .main {
      padding: 18px 14px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .hint {
      font-size: 14px;
      color: var(--sub);
      text-align: center;
      line-height: 1.5;
    }

    .stage-box {
      width: 100%;
      min-height: 280px;
      border-radius: 24px;
      background: linear-gradient(180deg, #e0f2fe 0%, #dbeafe 50%, #f5f3ff 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .orb1, .orb2, .orb3 {
      position: absolute;
      border-radius: 999px;
      background: rgba(255,255,255,0.32);
      filter: blur(0.3px);
      animation: floatSlow 4s ease-in-out infinite;
    }

    .orb1 { width: 24px; height: 24px; left: 30px; top: 46px; }
    .orb2 { width: 14px; height: 14px; right: 42px; top: 72px; animation-duration: 5s; }
    .orb3 { width: 18px; height: 18px; right: 88px; top: 36px; animation-duration: 4.5s; }

    .ground {
      position: absolute;
      left: -10px;
      right: -10px;
      bottom: 0;
      height: 74px;
      background: linear-gradient(180deg, #bfdbfe, #93c5fd);
      border-radius: 42px 42px 0 0;
      opacity: 0.95;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-12px); opacity: 1; }
    }

    .character-wrap {
      position: relative;
      z-index: 2;
      text-align: center;
      animation: float 2.8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .character {
      font-size: 92px;
      line-height: 1.1;
      user-select: none;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage-name {
      margin-top: 8px;
      font-size: 21px;
      font-weight: 800;
      color: #374151;
    }

    .stage-desc {
      margin-top: 6px;
      font-size: 14px;
      color: var(--sub);
      line-height: 1.5;
      max-width: 310px;
    }

    .egg-selector {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .egg-card {
      border: 2px solid transparent;
      border-radius: 18px;
      background: rgba(255,255,255,0.92);
      padding: 12px 6px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .egg-card:active {
      transform: scale(0.96);
    }

    .egg-card.selected {
      border-color: #f59e0b;
      background: #fff7d9;
    }

    .egg-emoji {
      font-size: 36px;
      display: block;
      margin-bottom: 6px;
    }

    .actions {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .actions h3,
    .history h3 {
      font-size: 16px;
      margin: 0 0 6px 0;
      color: #374151;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 18px;
      padding: 14px 10px;
      font-size: 16px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .plus2 { background: linear-gradient(180deg, #4ade80, #22c55e); }
    .plus1 { background: linear-gradient(180deg, #60a5fa, #3b82f6); }
    .minus1 { background: linear-gradient(180deg, #fb7185, #f43f5e); }
    .minus2 { background: linear-gradient(180deg, #f87171, #ef4444); }
    .ghost { background: linear-gradient(180deg, #a78bfa, #8b5cf6); }

    .footer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .tiny {
      text-align: center;
      font-size: 12px;
      color: var(--sub);
      margin-top: 2px;
      line-height: 1.5;
    }

    .history {
      padding: 14px;
      margin-bottom: 8px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 190px;
      overflow: auto;
      margin-top: 8px;
    }

    .history-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,0.92);
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .tag-plus {
      color: var(--green);
      font-weight: 700;
    }

    .tag-minus {
      color: var(--red);
      font-weight: 700;
    }

    .burst {
      position: absolute;
      z-index: 5;
      font-size: 30px;
      animation: burstUp 1s ease forwards;
      pointer-events: none;
      white-space: nowrap;
    }

    @keyframes burstUp {
      0% { transform: translateY(0) scale(0.7); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-70px) scale(1.08); opacity: 0; }
    }

    .evolve-glow {
      animation: glow 0.7s ease 2;
    }

    @keyframes glow {
      0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(236, 72, 153, 0)); }
      50% { transform: scale(1.12); filter: drop-shadow(0 0 18px rgba(236, 72, 153, 0.85)); }
      100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(236, 72, 153, 0)); }
    }

    @media (max-width: 380px) {
      .character {
        font-size: 78px;
      }
      .action-grid {
        grid-template-columns: 1fr;
      }
      .egg-selector {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar card">
      <div class="stat">
        <div class="label">当前分数</div>
        <div class="value" id="scoreValue">0</div>
      </div>
      <div class="stat">
        <div class="label">当前等级</div>
        <div class="value" id="levelValue">1级</div>
      </div>
    </div>

    <div class="main card">
      <div class="hint" id="topHint">先选一个喜欢的蛋，开启你的成长养成之旅。</div>

      <div class="stage-box" id="stageBox">
        <div class="orb1"></div>
        <div class="orb2"></div>
        <div class="orb3"></div>
        <div class="ground"></div>

        <div class="character-wrap" id="characterWrap">
          <div class="character" id="characterEmoji">🥚</div>
          <div class="stage-name" id="stageName">一级：请选择蛋</div>
          <div class="stage-desc" id="stageDesc">请选择下方 4 个蛋中的一个，开启专属成长路线</div>
        </div>
      </div>

      <div class="egg-selector" id="eggSelector"></div>
    </div>

    <div class="actions card">
      <h3>加分项 / 减分项</h3>
      <div class="action-grid">
        <button class="btn plus2" onclick="changeScore(2, '作业完成')">作业完成 +2</button>
        <button class="btn plus1" onclick="changeScore(1, '表现好')">表现好 +1</button>
        <button class="btn minus1" onclick="changeScore(-1, '表现差')">表现差 -1</button>
        <button class="btn minus2" onclick="changeScore(-2, '作业没完成')">作业没完成 -2</button>
      </div>
      <div class="footer-actions">
        <button class="btn ghost" onclick="resetToday()">重置分数</button>
        <button class="btn ghost" onclick="clearAllData()">清空全部</button>
      </div>
      <div class="tiny">数据会自动保存在本机浏览器里，下次打开还在。</div>
    </div>

    <div class="history card">
      <h3>成长记录</h3>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'mike_growth_multiline_v2';

    const eggs = [
      { id: 'mermaid', emoji: '🩷🥚', name: '人鱼蛋' },
      { id: 'elf', emoji: '💚🥚', name: '精灵蛋' },
      { id: 'dragon', emoji: '❤️🥚', name: '龙王蛋' },
      { id: 'crystal', emoji: '💎🥚', name: '水晶蛋' }
    ];

    const levelRules = [
      { level: 1, min: 0, max: 9 },
      { level: 2, min: 10, max: 19 },
      { level: 3, min: 20, max: 29 },
      { level: 4, min: 30, max: 39 },
      { level: 5, min: 40, max: 50 },
      { level: 6, min: 51, max: Infinity }
    ];

    const seriesStages = {
      mermaid: {
        1: { emoji: '🩷🥚', name: '一级：人鱼蛋', desc: '温柔的海洋魔法，正在蛋里慢慢苏醒' },
        2: { emoji: '🧚‍♀️', name: '二级：小海精灵', desc: '她先以海洋小精灵的样子出现，轻盈又可爱' },
        3: { emoji: '🧜', name: '三级：小人鱼', desc: '小尾巴长出来啦，正在学习游向更远的海域' },
        4: { emoji: '🧜‍♀️', name: '四级：青春期美人鱼', desc: '她正在蜕变，越来越优雅，也越来越自信' },
        5: { emoji: '✨🧜‍♀️', name: '五级：绝美美人鱼', desc: '已经成长为非常非常美丽的美人鱼啦' },
        6: { emoji: '👑🧜‍♀️', name: '六级：皇冠美人鱼女王', desc: '顶级进化完成，成为戴皇冠的美人鱼女王' }
      },
      elf: {
        1: { emoji: '💚🥚', name: '一级：精灵蛋', desc: '森林里的能量正在蛋里聚集，等待精灵苏醒' },
        2: { emoji: '✨', name: '二级：小光点精灵', desc: '刚刚诞生的精灵像一颗会发光的小星星' },
        3: { emoji: '🧚', name: '三级：小翅膀精灵', desc: '长出小翅膀啦，已经可以轻轻飞起来了' },
        4: { emoji: '🧚‍♂️', name: '四级：森林精灵', desc: '守护花草树木的森林精灵，灵气越来越强' },
        5: { emoji: '🌟🧝', name: '五级：高阶精灵', desc: '已经成为高阶精灵，拥有更强的守护力量' },
        6: { emoji: '👑🧝', name: '六级：精灵王', desc: '最高进化完成，成为闪耀而高贵的精灵王' }
      },
      dragon: {
        1: { emoji: '❤️🥚', name: '一级：龙王蛋', desc: '龙族的火焰力量，正在蛋中慢慢积蓄' },
        2: { emoji: '🐉', name: '二级：小小龙', desc: '刚破壳的小龙，虽然小，却已经很有气势' },
        3: { emoji: '🦎', name: '三级：幼龙', desc: '幼龙开始长大，拥有更强的力量和速度' },
        4: { emoji: '🐲', name: '四级：飞龙', desc: '会飞的龙出现啦，翅膀和战斗力都更强了' },
        5: { emoji: '🔥🐉', name: '五级：圣龙', desc: '圣龙形态觉醒，拥有更强大的守护与攻击能力' },
        6: { emoji: '👑🐉', name: '六级：龙王', desc: '最终进化为威严十足的龙王，拥有统领群龙的力量' }
      },
      crystal: {
        1: { emoji: '💎🥚', name: '一级：水晶蛋', desc: '晶莹的能量被包裹在蛋中，等待慢慢成形' },
        2: { emoji: '·', name: '二级：小沙粒', desc: '从最小的一粒沙开始，成长往往都始于微小' },
        3: { emoji: '🪨', name: '三级：发光石头', desc: '沙粒凝聚成石头，开始出现淡淡的光' },
        4: { emoji: '🔮', name: '四级：小晶石', desc: '石头里长出了晶体，已经越来越漂亮了' },
        5: { emoji: '💠', name: '五级：华丽水晶', desc: '已经成长为闪闪发光、非常漂亮的大水晶' },
        6: { emoji: '👑💎', name: '六级：水晶王冠', desc: '顶级进化完成，成为璀璨耀眼的水晶王冠' }
      }
    };

    let state = {
      score: 0,
      eggId: null,
      history: []
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state = JSON.parse(raw);
      } catch (e) {}
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function getLevelByScore(score) {
      return levelRules.find(s => score >= s.min && score <= s.max) || levelRules[0];
    }

    function getEggObj(id) {
      return eggs.find(e => e.id === id);
    }

    function getCurrentStage() {
      const level = getLevelByScore(state.score).level;
      if (!state.eggId) {
        return {
          emoji: '🥚',
          name: '一级：请选择蛋',
          desc: '请选择下方 4 个蛋中的一个，开启专属成长路线'
        };
      }
      return seriesStages[state.eggId][level];
    }

    function renderEggs() {
      const wrap = document.getElementById('eggSelector');
      wrap.innerHTML = '';
      const isLocked = !!state.eggId;

      eggs.forEach(egg => {
        const div = document.createElement('div');
        div.className = 'egg-card' + (state.eggId === egg.id ? ' selected' : '');
        div.innerHTML = `
          <span class="egg-emoji">${egg.emoji}</span>
          <div>${egg.name}</div>
        `;
        div.onclick = () => {
          if (isLocked) return;
          state.eggId = egg.id;
          state.history.unshift(makeHistory('领取了 ' + egg.name, '+0'));
          saveState();
          renderAll();
          showBurst('✨已领取');
        };
        wrap.appendChild(div);
      });
    }

    function makeHistory(label, delta) {
      const now = new Date();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const hh = String(now.getHours()).padStart(2, '0');
      const mi = String(now.getMinutes()).padStart(2, '0');
      return {
        label,
        delta,
        time: `${mm}-${dd} ${hh}:${mi}`
      };
    }

    function renderHistory() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';

      if (!state.history.length) {
        const empty = document.createElement('div');
        empty.className = 'history-item';
        empty.innerHTML = `<span>还没有记录，快开始成长吧～</span><span></span>`;
        list.appendChild(empty);
        return;
      }

      state.history.slice(0, 20).forEach(item => {
        const row = document.createElement('div');
        row.className = 'history-item';
        const cls = item.delta.startsWith('-') ? 'tag-minus' : 'tag-plus';
        row.innerHTML = `
          <div>
            <div>${item.label}</div>
            <div style="font-size:12px;color:#7c8a7f;margin-top:4px;">${item.time}</div>
          </div>
          <div class="${cls}">${item.delta}</div>
        `;
        list.appendChild(row);
      });
    }

    function renderStage(leveledUp = false) {
      const level = getLevelByScore(state.score);
      const stage = getCurrentStage();
      const egg = getEggObj(state.eggId);

      document.getElementById('scoreValue').textContent = state.score;
      document.getElementById('levelValue').textContent = `${level.level}级`;
      document.getElementById('characterEmoji').textContent = stage.emoji;
      document.getElementById('stageName').textContent = stage.name;
      document.getElementById('stageDesc').textContent = stage.desc;

      const topHint = document.getElementById('topHint');
      const characterWrap = document.getElementById('characterWrap');

      if (!state.eggId) {
        topHint.textContent = '先选一个喜欢的蛋，开启你的成长养成之旅。';
      } else {
        topHint.textContent = `当前选择：${egg.name} ｜ 继续努力，它会按自己的路线不断进化。`;
      }

      if (leveledUp) {
        characterWrap.classList.remove('evolve-glow');
        void characterWrap.offsetWidth;
        characterWrap.classList.add('evolve-glow');
      }
    }

    function renderAll(leveledUp = false) {
      renderEggs();
      renderStage(leveledUp);
      renderHistory();
    }

    function showBurst(text) {
      const stageBox = document.getElementById('stageBox');
      const div = document.createElement('div');
      div.className = 'burst';
      div.textContent = text;
      div.style.left = '50%';
      div.style.top = '48%';
      div.style.transform = 'translateX(-50%)';
      stageBox.appendChild(div);
      setTimeout(() => div.remove(), 1000);
    }

    function changeScore(delta, label) {
      if (!state.eggId) {
        alert('请先在上方选择一个蛋，再开始加分或扣分。');
        return;
      }

      const oldLevel = getLevelByScore(state.score).level;
      state.score += delta;
      if (state.score < 0) state.score = 0;

      const actualDelta = (delta >= 0 ? '+' : '') + delta;
      state.history.unshift(makeHistory(label, actualDelta));

      if (state.history.length > 100) {
        state.history = state.history.slice(0, 100);
      }

      const newLevel = getLevelByScore(state.score).level;
      saveState();
      renderAll(newLevel > oldLevel);

      showBurst(delta > 0 ? `+${delta}` : `${delta}`);

      if (newLevel > oldLevel) {
        setTimeout(() => {
          const egg = getEggObj(state.eggId);
          alert(`恭喜升级到 ${newLevel} 级！\n你的 ${egg.name} 进化啦！`);
        }, 80);
      }
    }

    function resetToday() {
      if (!confirm('确定要把分数重置为 0 分吗？蛋会保留。')) return;
      state.score = 0;
      state.history.unshift(makeHistory('重置分数', '+0'));
      saveState();
      renderAll();
    }

    function clearAllData() {
      if (!confirm('确定清空全部数据吗？分数、记录、已领取的蛋都会清除。')) return;
      state = {
        score: 0,
        eggId: null,
        history: []
      };
      saveState();
      renderAll();
    }

    loadState();
    renderAll();
  </script>
</body>
</html>
