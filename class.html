<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>学生积分养成系统</title>
<style>
  :root{
    --bg:#f4f7fc;
    --panel:#ffffff;
    --line:#e5ebf5;
    --text:#1f2937;
    --muted:#6b7280;
    --primary:#4f46e5;
    --primary2:#7c3aed;
    --green:#16a34a;
    --red:#dc2626;
    --gold:#f59e0b;
    --sun:#fbbf24;
    --shadow:0 10px 30px rgba(15,23,42,.08);
    --radius:18px;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:linear-gradient(180deg,#f7f9fd,#edf3fb);
  }
  .app{
    max-width:1440px;
    margin:0 auto;
    padding:20px;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .title h1{
    margin:0;
    font-size:30px;
    line-height:1.2;
  }
  .title p{
    margin:8px 0 0;
    color:var(--muted);
    font-size:14px;
  }

  .menu-tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .menu-tab{
    padding:10px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    font-weight:800;
    color:var(--text);
  }
  .menu-tab.active{
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    border-color:transparent;
  }

  .page{display:none}
  .page.active{display:block}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .panel-head{
    padding:16px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .panel-head h2{
    margin:0;
    font-size:18px;
  }
  .muted{color:var(--muted);font-size:13px}
  .panel-body{padding:18px}

  .btn{
    border:none;
    background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;
    padding:11px 16px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
  }
  .btn.secondary{
    background:#fff;
    color:var(--text);
    border:1px solid var(--line);
  }
  .btn.dark{
    background:#111827;
    color:#fff;
  }

  /* 首页学生卡片 */
  .students-grid{
    display:grid;
    grid-template-columns:repeat(4, minmax(0,1fr));
    gap:14px;
  }
  .student-card{
    position:relative;
    border:1.5px solid var(--line);
    border-radius:16px;
    background:linear-gradient(180deg,#fff,#fbfcff);
    padding:12px;
    min-height:190px;
    transition:.18s ease;
    overflow:hidden;
  }
  .student-card:hover{
    transform:translateY(-2px);
    box-shadow:var(--shadow);
    border-color:rgba(79,70,229,.35);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:4px;
  }
  .student-name-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    max-width:68%;
    flex-wrap:wrap;
  }
  .student-name{
    font-size:18px;
    font-weight:800;
    line-height:1.2;
    word-break:break-word;
  }
  .sun-badges{
    display:flex;
    gap:2px;
    flex-wrap:wrap;
  }
  .sun{
    font-size:14px;
    line-height:1;
    color:var(--sun);
  }
  .student-level{
    font-size:12px;
    color:var(--primary);
    font-weight:800;
    background:rgba(79,70,229,.09);
    padding:6px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .pet-box{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:84px;
    margin-top:2px;
  }
  .pet-art{
    font-size:56px;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.08));
    user-select:none;
  }
  .evo-name{
    text-align:center;
    font-size:14px;
    font-weight:700;
    margin:2px 0 10px;
  }
  .score-wrap{
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    background:#fff;
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
    min-height:82px;
  }
  .score-left{
    min-width:0;
    flex:1;
  }
  .score-wrap .small{
    font-size:12px;
    color:var(--muted);
    margin-bottom:2px;
  }
  .score-wrap .big{
    font-size:22px;
    font-weight:900;
  }

  /* 悬停加减分：2x2，放在积分右侧 */
  .hover-actions{
    width:96px;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:6px;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:.18s ease;
  }
  .student-card:hover .hover-actions{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .action-btn{
    border:none;
    border-radius:10px;
    padding:7px 6px;
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    backdrop-filter:blur(8px);
  }
  .plus{background:#eaf8ef;color:var(--green);border:1px solid #bfe8cb}
  .minus{background:#fff1f1;color:var(--red);border:1px solid #f2c3c3}

  /* 设置页 */
  .setup-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
  .student-setup{
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    background:#fafbff;
  }
  .student-setup label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  input[type="text"], input[type="number"], select, textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    font-size:14px;
    outline:none;
    background:#fff;
  }
  textarea{
    min-height:110px;
    resize:vertical;
  }
  .setup-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }
  .json-box{
    margin-top:14px;
    display:grid;
    gap:10px;
  }

  /* 兑换页 */
  .exchange-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  .student-select-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:12px;
  }
  .mini-student{
    border:1px solid var(--line);
    border-radius:14px;
    background:#fff;
    padding:12px;
    cursor:pointer;
    transition:.18s ease;
  }
  .mini-student.active{
    border-color:var(--primary);
    box-shadow:0 0 0 4px rgba(79,70,229,.08);
  }
  .mini-student .name-line{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:6px;
  }
  .mini-student .name{
    font-weight:800;
  }
  .mini-student .meta{
    font-size:13px;
    color:var(--muted);
  }

  .reward-item{
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px;
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
    background:#fff;
    margin-bottom:10px;
  }
  .reward-item h4{
    margin:0 0 6px;
    font-size:15px;
  }
  .reward-item p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }
  .reward-item .cost{
    font-weight:900;
    color:var(--gold);
    font-size:14px;
    margin-top:4px;
  }
  .reward-config{
    display:grid;
    gap:10px;
    margin-top:12px;
  }
  .reward-config-item{
    display:grid;
    grid-template-columns:1.4fr .8fr auto;
    gap:8px;
    align-items:center;
  }

  .history{
    display:grid;
    gap:8px;
    max-height:220px;
    overflow:auto;
    margin-top:12px;
  }
  .log{
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    font-size:13px;
    background:#fafbff;
  }
  .empty{
    color:var(--muted);
    font-size:13px;
    padding:12px;
    text-align:center;
    border:1px dashed var(--line);
    border-radius:12px;
  }

  @media (max-width:1180px){
    .students-grid{grid-template-columns:repeat(3, minmax(0,1fr))}
    .exchange-layout{grid-template-columns:1fr}
  }
  @media (max-width:900px){
    .students-grid,.setup-grid,.student-select-grid{grid-template-columns:repeat(2, minmax(0,1fr))}
    .reward-config-item{grid-template-columns:1fr}
  }
  @media (max-width:620px){
    .app{padding:12px}
    .title h1{font-size:24px}
    .students-grid,.setup-grid,.student-select-grid{grid-template-columns:1fr}
    .student-card{min-height:210px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="title">
      <h1>学生积分养成系统</h1>
      <p>首页只显示学生卡片；设置与兑换移到顶部菜单切换，适合电脑浏览器使用。</p>
    </div>
  </div>

  <div class="menu-tabs">
    <button class="menu-tab active" data-page="homePage" onclick="switchPage('homePage')">首页 · 学生卡片</button>
    <button class="menu-tab" data-page="setupPage" onclick="switchPage('setupPage')">第二标签页 · 学生初始化 / 修改</button>
    <button class="menu-tab" data-page="exchangePage" onclick="switchPage('exchangePage')">第三标签页 · 积分兑换</button>
  </div>

  <!-- 首页 -->
  <div class="page active" id="homePage">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>学生卡片</h2>
          <div class="muted">悬停学生卡片时，会在积分右侧显示 2×2 的加减分按钮。</div>
        </div>
      </div>
      <div class="panel-body">
        <div id="studentsGrid" class="students-grid"></div>
      </div>
    </div>
  </div>

  <!-- 第二标签页：初始化 -->
  <div class="page" id="setupPage">
    <div class="panel">
      <div class="panel-head">
        <div>
          <h2>学生初始化 / 修改</h2>
          <div class="muted">可配置 10 个学生的姓名、蛋样式和积分，保存后会同步更新首页。</div>
        </div>
        <div class="setup-actions">
          <button class="btn" onclick="saveSetup()">保存学生设置</button>
          <button class="btn secondary" onclick="exportJson()">导出 JSON</button>
          <button class="btn secondary" onclick="importJson()">导入 JSON</button>
          <button class="btn secondary" onclick="resetAllData()">重置全部数据</button>
        </div>
      </div>
      <div class="panel-body">
        <div id="setupGrid" class="setup-grid"></div>

        <div class="json-box">
          <div class="muted">JSON 数据框：点击“导出 JSON”会写入这里；也可以把外部 JSON 粘贴到这里，再点击“导入 JSON”。</div>
          <textarea id="jsonTextarea" placeholder="这里显示导出的 JSON，或粘贴 JSON 后导入"></textarea>
        </div>
      </div>
    </div>
  </div>

  <!-- 第三标签页：兑换 -->
  <div class="page" id="exchangePage">
    <div class="exchange-layout">
      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>选择学生</h2>
            <div class="muted">选择一位学生后，可使用他的积分兑换奖品。</div>
          </div>
        </div>
        <div class="panel-body">
          <div id="exchangeStudentInfo" class="muted">当前未选择学生</div>
          <div id="studentSelectGrid" class="student-select-grid"></div>

          <div style="margin-top:18px;">
            <h3 style="margin:0 0 10px;font-size:16px;">最近记录</h3>
            <div id="historyBox" class="history"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>奖品兑换与设置</h2>
            <div class="muted">奖品名称与所需积分均可自定义。</div>
          </div>
          <button class="btn secondary" onclick="addReward()">新增奖品</button>
        </div>
        <div class="panel-body">
          <div id="rewardList"></div>

          <div style="margin-top:18px;">
            <h3 style="margin:0 0 10px;font-size:16px;">奖品配置</h3>
            <div id="rewardConfig" class="reward-config"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'student_points_evolution_v4';

const PETS = {
  mermaid: {
    label:'人鱼蛋',
    stages:[
      {name:'人鱼蛋', icon:'🥚'},
      {name:'小人鱼', icon:'🧜‍♀️'},
      {name:'珊瑚人鱼', icon:'🪸'},
      {name:'深海人鱼', icon:'🧜'},
      {name:'海洋守护者', icon:'👑'}
    ]
  },
  elf: {
    label:'精灵蛋',
    stages:[
      {name:'精灵蛋', icon:'🥚'},
      {name:'小精灵', icon:'🧚'},
      {name:'森林精灵', icon:'🌿'},
      {name:'月光精灵', icon:'✨'},
      {name:'精灵王', icon:'🧝'}
    ]
  },
  dragon: {
    label:'龙王蛋',
    stages:[
      {name:'龙王蛋', icon:'🥚'},
      {name:'幼龙', icon:'🐉'},
      {name:'火焰龙', icon:'🔥'},
      {name:'苍穹龙', icon:'⚡'},
      {name:'龙王', icon:'👑🐉'}
    ]
  },
  crystal: {
    label:'水晶蛋',
    stages:[
      {name:'砂晶蛋', icon:'🥚'},
      {name:'小晶石', icon:'💎'},
      {name:'彩晶体', icon:'🔮'},
      {name:'光辉水晶', icon:'✨💎'},
      {name:'水晶王', icon:'👑💎'}
    ]
  }
};

const LEVEL_RULES = [
  { level:1, min:0, title:'L1 新手' },
  { level:2, min:10, title:'L2 起步' },
  { level:3, min:25, title:'L3 成长' },
  { level:4, min:50, title:'L4 进阶' },
  { level:5, min:80, title:'L5 高手' },
  { level:6, min:120, title:'L6 大师' }
];

const EVO_THRESHOLDS = [0, 10, 30, 60, 100];

const defaultStudents = Array.from({length:10}, (_,i)=>({
  id:i+1,
  name:`学生${i+1}`,
  pet:'mermaid',
  score:0
}));

const defaultRewards = [
  { id:1, name:'贴纸一张', cost:10 },
  { id:2, name:'糖果一颗', cost:20 },
  { id:3, name:'小奖章', cost:30 },
  { id:4, name:'抽奖一次', cost:50 }
];

const defaultState = {
  students: defaultStudents,
  selectedStudentId: 1,
  rewards: defaultRewards,
  logs:[]
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(defaultState);
    return { ...structuredClone(defaultState), ...JSON.parse(raw) };
  }catch(e){
    return structuredClone(defaultState);
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getStudent(id){
  return state.students.find(s=>s.id===id);
}

function getLevel(score){
  let current = LEVEL_RULES[0];
  for(const rule of LEVEL_RULES){
    if(score >= rule.min) current = rule;
  }
  return current;
}

function getStageIndex(score){
  let idx = 0;
  for(let i=0;i<EVO_THRESHOLDS.length;i++){
    if(score >= EVO_THRESHOLDS[i]) idx = i;
  }
  return Math.min(idx,4);
}

function getPetStage(student){
  const pet = PETS[student.pet] || PETS.mermaid;
  return pet.stages[getStageIndex(student.score)];
}

function getSunCount(score){
  return Math.min(5, Math.floor(score / 60));
}

function renderSuns(score){
  const count = getSunCount(score);
  if(count <= 0) return '';
  return `<span class="sun-badges">${Array.from({length:count}, () => `<span class="sun">☀️</span>`).join('')}</span>`;
}

function switchPage(pageId){
  document.querySelectorAll('.menu-tab').forEach(el=>{
    el.classList.toggle('active', el.dataset.page === pageId);
  });
  document.querySelectorAll('.page').forEach(el=>{
    el.classList.toggle('active', el.id === pageId);
  });
}

function renderStudents(){
  const box = document.getElementById('studentsGrid');
  box.innerHTML = '';
  state.students.forEach(student=>{
    const level = getLevel(student.score);
    const stage = getPetStage(student);
    const card = document.createElement('div');
    card.className = 'student-card';
    card.innerHTML = `
      <div>
        <div class="card-top">
          <div class="student-name-wrap">
            <div class="student-name">${escapeHtml(student.name || '未命名')}</div>
            ${renderSuns(student.score)}
          </div>
          <div class="student-level">${level.title}</div>
        </div>
        <div class="pet-box">
          <div class="pet-art">${stage.icon}</div>
        </div>
        <div class="evo-name">${stage.name}</div>
      </div>

      <div class="score-wrap">
        <div class="score-left">
          <div class="small">积分</div>
          <div class="big">${student.score}</div>
        </div>

        <div class="hover-actions">
          <button class="action-btn plus" onclick="event.stopPropagation(); changeScore(${student.id}, 1)">+1</button>
          <button class="action-btn plus" onclick="event.stopPropagation(); changeScore(${student.id}, 5)">+5</button>
          <button class="action-btn minus" onclick="event.stopPropagation(); changeScore(${student.id}, -1)">-1</button>
          <button class="action-btn minus" onclick="event.stopPropagation(); changeScore(${student.id}, -5)">-5</button>
        </div>
      </div>
    `;
    box.appendChild(card);
  });
}

function renderSetup(){
  const box = document.getElementById('setupGrid');
  box.innerHTML = '';
  state.students.forEach(student=>{
    const div = document.createElement('div');
    div.className = 'student-setup';
    div.innerHTML = `
      <label>学生姓名</label>
      <input type="text" value="${escapeAttr(student.name)}" id="name_${student.id}" placeholder="请输入姓名">

      <label style="margin-top:10px;">选择蛋的样式</label>
      <select id="pet_${student.id}">
        ${Object.entries(PETS).map(([key,val])=>`
          <option value="${key}" ${student.pet===key?'selected':''}>${val.label}</option>
        `).join('')}
      </select>

      <label style="margin-top:10px;">当前积分</label>
      <input type="number" value="${student.score}" id="score_${student.id}" placeholder="请输入积分">
    `;
    box.appendChild(div);
  });
}

function renderExchangeStudents(){
  const box = document.getElementById('studentSelectGrid');
  const info = document.getElementById('exchangeStudentInfo');
  const current = getStudent(state.selectedStudentId);

  if(current){
    info.textContent = `当前学生：${current.name} · 积分 ${current.score} · 等级 ${getLevel(current.score).title}`;
  }else{
    info.textContent = '当前未选择学生';
  }

  box.innerHTML = '';
  state.students.forEach(student=>{
    const div = document.createElement('div');
    div.className = 'mini-student' + (state.selectedStudentId === student.id ? ' active' : '');
    div.onclick = ()=>selectStudent(student.id);
    div.innerHTML = `
      <div class="name-line">
        <span class="name">${escapeHtml(student.name)}</span>
        ${renderSuns(student.score)}
      </div>
      <div class="meta">积分：${student.score}</div>
      <div class="meta">等级：${getLevel(student.score).title}</div>
    `;
    box.appendChild(div);
  });
}

function renderHistory(){
  const box = document.getElementById('historyBox');
  if(!state.logs.length){
    box.innerHTML = `<div class="empty">还没有记录。</div>`;
    return;
  }
  box.innerHTML = state.logs.slice(0,20).map(log=>`
    <div class="log">${escapeHtml(log)}</div>
  `).join('');
}

function renderRewards(){
  const box = document.getElementById('rewardList');
  const student = getStudent(state.selectedStudentId);
  box.innerHTML = '';
  state.rewards.forEach(item=>{
    const can = student && student.score >= Number(item.cost || 0);
    const div = document.createElement('div');
    div.className = 'reward-item';
    div.innerHTML = `
      <div>
        <h4>${escapeHtml(item.name || '未命名奖品')}</h4>
        <p>使用积分兑换该奖品</p>
        <div class="cost">需要 ${item.cost || 0} 积分</div>
      </div>
      <div>
        <button class="btn dark" onclick="exchangeReward(${item.id})">${can ? '立即兑换' : '积分不足'}</button>
      </div>
    `;
    box.appendChild(div);
  });
}

function renderRewardConfig(){
  const box = document.getElementById('rewardConfig');
  box.innerHTML = '';
  state.rewards.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'reward-config-item';
    row.innerHTML = `
      <input type="text" value="${escapeAttr(item.name)}" onchange="updateRewardName(${item.id}, this.value)" placeholder="奖品名称">
      <input type="number" value="${item.cost}" onchange="updateRewardCost(${item.id}, this.value)" placeholder="所需积分">
      <button class="btn secondary" onclick="removeReward(${item.id})">删除</button>
    `;
    box.appendChild(row);
  });
}

function selectStudent(id){
  state.selectedStudentId = id;
  saveState();
  renderAll();
}

function changeScore(studentId, delta){
  const s = getStudent(studentId);
  if(!s) return;
  s.score = Math.max(0, s.score + delta);
  const action = delta > 0 ? `+${delta}` : `${delta}`;
  const stage = getPetStage(s).name;
  const log = `${formatTime()} · ${s.name} ${action} 分，当前 ${s.score} 分，等级 ${getLevel(s.score).title}，形态 ${stage}`;
  state.logs.unshift(log);
  state.logs = state.logs.slice(0,100);
  state.selectedStudentId = studentId;
  saveState();
  renderAll();
}

function exchangeReward(id){
  const s = getStudent(state.selectedStudentId);
  if(!s){
    alert('请先选择一位学生');
    return;
  }
  const item = state.rewards.find(r=>r.id===id);
  if(!item) return;
  const cost = Number(item.cost || 0);
  if(s.score < cost){
    alert('当前积分不足，无法兑换');
    return;
  }
  s.score -= cost;
  const log = `${formatTime()} · ${s.name} 兑换了「${item.name}」，消耗 ${cost} 分，剩余 ${s.score} 分`;
  state.logs.unshift(log);
  state.logs = state.logs.slice(0,100);
  saveState();
  renderAll();
  alert(`兑换成功：${s.name} 已兑换 ${item.name}`);
}

function updateRewardName(id, value){
  const item = state.rewards.find(r=>r.id===id);
  if(!item) return;
  item.name = value;
  saveState();
  renderRewards();
}
function updateRewardCost(id, value){
  const item = state.rewards.find(r=>r.id===id);
  if(!item) return;
  item.cost = Math.max(0, Number(value || 0));
  saveState();
  renderRewards();
}
function addReward(){
  const maxId = state.rewards.length ? Math.max(...state.rewards.map(r=>r.id)) : 0;
  state.rewards.push({ id:maxId+1, name:'新奖品', cost:10 });
  saveState();
  renderRewardConfig();
  renderRewards();
}
function removeReward(id){
  state.rewards = state.rewards.filter(r=>r.id!==id);
  saveState();
  renderRewardConfig();
  renderRewards();
}

function saveSetup(){
  state.students.forEach(student=>{
    const name = document.getElementById(`name_${student.id}`).value.trim();
    const pet = document.getElementById(`pet_${student.id}`).value;
    const score = Number(document.getElementById(`score_${student.id}`).value || 0);
    student.name = name || `学生${student.id}`;
    student.pet = pet in PETS ? pet : 'mermaid';
    student.score = Math.max(0, score);
  });
  saveState();
  renderAll();
  alert('学生设置已保存');
}

function exportJson(){
  const text = JSON.stringify(state, null, 2);
  document.getElementById('jsonTextarea').value = text;
  try{
    navigator.clipboard.writeText(text);
  }catch(e){}
  alert('JSON 已导出到文本框，并尝试复制到剪贴板');
}

function importJson(){
  const text = document.getElementById('jsonTextarea').value.trim();
  if(!text){
    alert('请先在文本框里粘贴 JSON');
    return;
  }
  try{
    const parsed = JSON.parse(text);
    if(!parsed.students || !Array.isArray(parsed.students)){
      alert('JSON 格式不正确：缺少 students');
      return;
    }
    state = {
      students: parsed.students.map((s, index) => ({
        id: index + 1,
        name: s.name || `学生${index+1}`,
        pet: PETS[s.pet] ? s.pet : 'mermaid',
        score: Math.max(0, Number(s.score || 0))
      })).slice(0,10),
      selectedStudentId: Number(parsed.selectedStudentId || 1),
      rewards: Array.isArray(parsed.rewards) ? parsed.rewards.map((r, i)=>({
        id: Number(r.id || i+1),
        name: r.name || `奖品${i+1}`,
        cost: Math.max(0, Number(r.cost || 0))
      })) : structuredClone(defaultRewards),
      logs: Array.isArray(parsed.logs) ? parsed.logs.slice(0,100) : []
    };
    while(state.students.length < 10){
      state.students.push({
        id: state.students.length + 1,
        name: `学生${state.students.length + 1}`,
        pet: 'mermaid',
        score: 0
      });
    }
    if(!getStudent(state.selectedStudentId)){
      state.selectedStudentId = 1;
    }
    saveState();
    renderAll();
    alert('JSON 导入成功');
  }catch(e){
    alert('JSON 格式解析失败，请检查内容');
  }
}

function resetAllData(){
  if(!confirm('确定要重置全部学生、积分、奖品和记录吗？')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = structuredClone(defaultState);
  document.getElementById('jsonTextarea').value = '';
  renderAll();
  alert('已重置全部数据');
}

function renderAll(){
  renderStudents();
  renderSetup();
  renderExchangeStudents();
  renderHistory();
  renderRewards();
  renderRewardConfig();
}

function formatTime(){
  const d = new Date();
  return `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function escapeHtml(str=''){
  return String(str).replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}
function escapeAttr(str=''){
  return escapeHtml(str);
}

renderAll();
</script>
</body>
</html>
